# Production deployment: dev.benardkimani.co.ke/nova, sharing the VPS and
# Traefik instance with the companion Go boilerplate. See nova.yml for the
# Traefik dynamic (file-provider) routing config that pairs with this.
services:
  nova:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_BASE_PATH: /nova
    restart: unless-stopped
    networks:
      - proxy_network
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/nova/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  proxy_network:
    external: true
