# Traefik dynamic (file-provider) config for the /nova path-prefixed route
# on the existing dev.benardkimani.co.ke domain. Deployed alongside
# goolang.yml (the companion Go boilerplate's router) on the same host, at
# /root/infra/traefik/dynamic/nova.yml. Reuses the domain's existing TLS
# cert — no separate certificate block needed here.
http:
  routers:
    nova-frontend:
      entryPoints:
        - websecure
      rule: Host(`dev.benardkimani.co.ke`) && PathPrefix(`/nova`)
      service: nova-frontend
      # goolang-frontend (in the sibling repo's goolang.yml) sets no explicit
      # priority, so Traefik falls back to its rule-length default — which
      # is NOT guaranteed to be lower than an arbitrary small number here.
      # A low explicit priority (e.g. 10) can accidentally lose to that
      # default, silently sending every /nova/* request to the Go site's SPA
      # fallback instead (verified: it happens). Set unambiguously high
      # instead of relying on comparing against an implicit default.
      priority: 100
      tls: {}
  services:
    nova-frontend:
      loadBalancer:
        servers:
          - url: http://nova:3000
